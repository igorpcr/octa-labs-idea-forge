name: Isolated Lovable Sync Validation
on:
  push:
    branches:
      - ci/validate-lovable-sync-isolated-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test
      - name: Build application
        run: bun run build
